<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>臺中地磁停車地圖</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="/style.css"></head><body><header><h1>臺中即時地磁停車地圖</h1><div id="updated">正在載入資料…</div></header><section class="toolbar"><label><input type="checkbox" id="vacant" checked> 空位</label><label><input type="checkbox" id="occupied"> 已占用</label><label><input type="checkbox" id="unknown"> 故障／未知</label><button id="locate">定位附近</button><button id="nearby">搜尋附近空位</button><button id="reload">重新整理</button></section><section id="stats">等待資料</section><aside id="nearby-panel" hidden><div class="nearby-head"><strong>附近空位</strong><label>範圍 <select id="radius"><option value="300">300 公尺</option><option value="500" selected>500 公尺</option><option value="1000">1 公里</option><option value="2000">2 公里</option></select></label><button id="close-nearby">關閉</button></div><p id="nearby-status"></p><div id="nearby-list"></div></aside><main id="map" aria-label="停車格地圖"></main><footer>資料來源：臺中市政府開放資料。狀態僅供參考，實際請以現場為準。地圖 © OpenStreetMap contributors。</footer><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/app.js"></script></body></html>
